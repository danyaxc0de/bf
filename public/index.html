<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BubFind</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{ --bg:#050508; --text:#ffffff; --sub:#a1a1aa; --accent:#0088cc; --accent2:#005f8f; --ok:#4ade80; --bad:#f87171; --star:#fbbf24; --yuk:#a855f7; }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
  body{ background: radial-gradient(circle at 10% 10%, rgba(0, 136, 204, 0.4), transparent 40%), radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.3), transparent 40%), #050508; }
  
  #app{position:relative;z-index:1;max-width:460px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
  .screen{display:none;flex-direction:column;flex:1;min-height:0;animation:slideIn .4s cubic-bezier(0.16, 1, 0.3, 1)}
  .screen.active{display:flex}
  @keyframes slideIn { from { opacity: 0; transform: translateY(15px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  
  .topbar{padding:env(safe-area-inset-top,0px) 20px 0;display:flex;align-items:center;justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 20px); z-index: 10;}
  .brand{font-weight:900;font-size:24px;letter-spacing:-0.04em;display:flex;align-items:center;gap:8px;}
  
  .glass { background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%); backdrop-filter: blur(40px) saturate(150%); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), inset 0 -1px 1px rgba(0, 0, 0, 0.2), 0 8px 32px rgba(0, 0, 0, 0.3); border-radius: 24px; }
  
  .badge{ font-size:12px;font-weight:800;color:#fff; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); padding:6px 12px;border-radius:999px; display:flex; align-items: center; gap:6px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  .badge.coins { color: var(--yuk); border-color: rgba(168,85,247,0.4); text-shadow: 0 0 10px rgba(168,85,247,0.5); }

  .field { display:flex;align-items:center;padding:4px 4px 4px 16px; }
  .field input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:16px;padding:12px 8px}
  .btn{ background: linear-gradient(135deg, rgba(0, 136, 204, 0.9), rgba(0, 95, 143, 0.9)); border: 1px solid rgba(255,255,255,0.3); color:#fff;font-weight:800;font-size:14px;border-radius:16px;padding:12px 20px;cursor:pointer; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4); }
  .btn-block{width:100%;padding:16px;border-radius:16px;font-size:16px}
  .card{ padding:20px; margin-bottom:16px; animation: slideIn 0.3s ease-out; }
  
  .tabbar{ position: fixed; bottom: calc(env(safe-area-inset-bottom, 10px) + 10px); left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; display:flex;justify-content:space-around;align-items:center; padding: 10px 15px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(50px) saturate(200%); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); z-index: 100; }
  .tabbar button{ background:none;border:none;color:var(--sub); display:flex;flex-direction:column;align-items:center;justify-content:center; width: 50px; height: 50px; border-radius: 50%; cursor:pointer; transition: 0.3s; }
  .tabbar button.active{ color:#fff; background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05)); }
  .tabbar button svg { width: 24px; height: 24px; fill: currentColor; }
  
  .content{flex:1;overflow:auto;padding:16px 20px 120px; z-index: 5;}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(30,30,40,0.8);backdrop-filter:blur(20px);border:1px solid var(--border);padding:12px 22px;border-radius:16px;font-size:13px;font-weight: 600;opacity:0;transition:all .3s;z-index:50;max-width:90%;text-align:center;}
  .toast.show{opacity:1; transform: translateX(-50%) translateY(-5px);}
  
  .top-user { display:flex; justify-content:space-between; align-items:center; padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .top-user:last-child { border-bottom: none; }
  .top-user .place { font-weight: 900; font-size: 16px; width: 30px; color: var(--sub); }
  .top-user .name { flex: 1; font-weight: 700; margin-left: 10px; }
  .top-user .value { font-weight: 900; color: var(--yuk); }
  .top-user:nth-child(1) .place { color: #fbbf24; text-shadow: 0 0 10px rgba(251,191,36,0.5); }
  .top-user:nth-child(2) .place { color: #d1d5db; }
  .top-user:nth-child(3) .place { color: #d97706; }
</style>
</head>
<body>
<div id="app">
  <!-- ВХОД -->
  <section class="screen active" id="screen-login">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px">
      <div style="width:90px;height:90px;border-radius:30px;background:linear-gradient(180deg, #0088cc, #005f8f);position:relative; box-shadow: 0 15px 50px rgba(0, 152, 234, 0.4), inset 0 2px 2px rgba(255,255,255,0.3);">
        <div style="position:absolute;inset:28%;border-radius:50%;background:var(--bg)"></div>
      </div>
      <div style="margin-top:24px;font-size:32px;font-weight:900; letter-spacing:-0.05em;">BubFind</div>
      <div style="margin-top:6px;font-size:14px;color:var(--sub); font-weight: 600;">Находи свободные юзернеймы</div>
    </div>
    <div style="padding:0 24px 24px;display:flex;flex-direction:column;gap:12px">
      <label style="font-size:12px;color:var(--sub); margin-left: 4px; font-weight: 600;">Логин</label>
      <input id="loginInput" class="field glass" style="padding:16px;color:var(--text);font-size:16px;">
      <label style="font-size:12px;color:var(--sub);margin-top:4px; margin-left: 4px; font-weight: 600;">Пароль</label>
      <input id="passInput" type="password" class="field glass" style="padding:16px;color:var(--text);font-size:16px;">
      <button class="btn btn-block" style="margin-top:10px" onclick="doLogin()">Войти</button>
      <button class="btn-ghost btn btn-block" onclick="doRegister()">Создать аккаунт</button>
    </div>
  </section>

  <!-- ПОИСК -->
  <section class="screen" id="screen-main">
    <div class="topbar">
      <div class="brand">BubFind</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="badge coins" onclick="showNoCoins()">
          <svg class="yuk-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H8v-2h3V8h2v3h3v2h-3v4h-2z"/></svg>
          <span id="coinCount">30</span>
        </div>
        <div class="badge" id="userTierBadge">FREE</div>
      </div>
    </div>
    <div class="content">
      <label style="font-size:13px;color:var(--sub); margin-left: 8px; font-weight: 600;">Поиск по имени (10 ЮК)</label>
      <div class="field glass" style="margin-bottom:16px; margin-top: 8px;">
        <input id="searchName" placeholder="Введи свое имя (danya)">
        <button class="btn" onclick="searchByName()">Подобрать</button>
      </div>
      <div style="font-size:12px; color:var(--sub); text-align:center; margin-bottom:20px;">Мы ищем свободные ники (имя + цифры/буквы)</div>
      <div id="nameResultBox"></div>
    </div>
    <div class="tabbar">
      <button class="active" onclick="go('main')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <button onclick="go('finds')"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button onclick="go('tops')"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 6h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg></button>
      <button onclick="go('profile')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
    </div>
  </section>

  <!-- НАХОДКИ -->
  <section class="screen" id="screen-finds">
    <div class="topbar"><div class="brand">Находки</div></div>
    <div class="content" id="findsList">Загрузка…</div>
    <div class="tabbar">
      <button onclick="go('main')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <button class="active" onclick="go('finds')"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button onclick="go('tops')"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 6h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg></button>
      <button onclick="go('profile')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
    </div>
  </section>

  <!-- ТОПЫ -->
  <section class="screen" id="screen-tops">
    <div class="topbar"><div class="brand">Топы</div></div>
    <div class="content">
      <div class="card glass" style="margin-bottom:16px">
        <div style="font-weight:900; margin-bottom:15px; font-size:16px;">💎 Топ по ЮКам</div>
        <div id="topUsersList">Загрузка...</div>
      </div>
      
      <div class="card glass">
        <div style="font-weight:900; margin-bottom:15px; font-size:16px;">🎯 Топ ловцов ников</div>
        <div id="topHuntersList">Загрузка...</div>
      </div>
    </div>
    <div class="tabbar">
      <button onclick="go('main')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <button onclick="go('finds')"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button class="active" onclick="go('tops')"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 6h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg></button>
      <button onclick="go('profile')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
    </div>
  </section>

  <!-- ПРОФИЛЬ -->
  <section class="screen" id="screen-profile">
    <div class="topbar"><div class="brand">Профиль</div></div>
    <div class="content">
      <div class="card glass" style="text-align:center; padding: 20px;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.1); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 24px;">👤</div>
        <div style="font-weight:900; font-size: 20px;" id="profileLogin">—</div>
        <div style="font-size:13px;color:var(--sub);margin-top:4px; font-weight: 600;" id="profileTier">Тариф: Free</div>
        <div style="margin-top: 15px;">
          <span style="font-size: 12px; color: var(--sub);">Выбранный ник:</span>
          <span style="font-weight: 900; color: var(--yuk); font-size: 16px; margin-left: 5px;" id="profileUsername">—</span>
        </div>
      </div>

      <div class="card glass" style="margin-bottom:16px">
        <div style="font-weight:900;margin-bottom:16px; font-size: 16px;">💎 Магазин ЮКов</div>
        <button class="premium-btn" onclick="buyCoins()"><span>50 ЮК</span> <span class="premium-price">25 ⭐</span></button>
        <button class="premium-btn" onclick="buyCoins()"><span>150 ЮК</span> <span class="premium-price">70 ⭐</span></button>
        <button class="premium-btn" onclick="buyCoins()"><span>500 ЮК</span> <span class="premium-price">200 ⭐</span></button>
      </div>

      <div class="card glass">
        <div style="font-weight:900;margin-bottom:16px; font-size: 16px;">💬 Сообщения</div>
        <div id="dialogsList">Здесь будут твои переписки...</div>
      </div>

      <button onclick="logout()" style="background:none; border:none; color:var(--sub); font-size:12px; text-decoration:underline; cursor:pointer; margin-top:20px; width:100%; text-align:center;">Выйти из аккаунта</button>
    </div>
    <div class="tabbar">
      <button onclick="go('main')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <button onclick="go('finds')"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button onclick="go('tops')"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 6h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg></button>
      <button class="active" onclick="go('profile')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = '';
let token = localStorage.getItem('bubfind_token') || null;
let currentCoins = 30;

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }
async function api(path, opts={}){ const res = await fetch(API_BASE + path, { ...opts, headers: { 'Content-Type':'application/json', ...(token ? {Authorization:'Bearer '+token} : {}), ...(opts.headers||{}) } }); const data = await res.json().catch(()=>({})); if(!res.ok) throw new Error(data.error || 'Ошибка запроса'); return data; }

function updateCoinsUI() { document.getElementById('coinCount').textContent = currentCoins; }

function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='finds') loadFinds();
  if(name==='profile') loadProfile();
  if(name==='tops') loadTops();
}

async function doLogin(){
  try{
    const data = await api('/auth/login', {method:'POST', body: JSON.stringify({ login: document.getElementById('loginInput').value, password: document.getElementById('passInput').value })});
    token = data.token; localStorage.setItem('bubfind_token', token); 
    localStorage.setItem('bubfind_login', document.getElementById('loginInput').value);
    localStorage.setItem('bubfind_tier', data.tier || 'free');
    if (data.profile_username) localStorage.setItem('bubfind_profile_username', data.profile_username);
    currentCoins = data.coins || 30; updateCoinsUI();
    toast('Успешный вход'); go('main');
  }catch(e){ toast(e.message); }
}

async function doRegister(){
  try{
    const data = await api('/auth/register', {method:'POST', body: JSON.stringify({ login: document.getElementById('loginInput').value, password: document.getElementById('passInput').value })});
    token = data.token; localStorage.setItem('bubfind_token', token); 
    localStorage.setItem('bubfind_login', document.getElementById('loginInput').value);
    localStorage.setItem('bubfind_tier', 'free');
    currentCoins = 30; updateCoinsUI();
    toast('Аккаунт создан'); go('main');
  }catch(e){ toast(e.message); }
}

function logout(){ token = null; localStorage.clear(); go('login'); }

function getRarity(score) {
  if (score >= 80) return { name: "ЛЕГЕНДАРНЫЙ", class: "rarity-legendary", color: "#fbbf24" };
  if (score >= 60) return { name: "ЭПИЧЕСКИЙ", class: "rarity-epic", color: "#a855f7" };
  if (score >= 40) return { name: "РЕДКИЙ", class: "rarity-rare", color: "#3b82f6" };
  return { name: "БАЗОВЫЙ", class: "rarity-base", color: "#a1a1aa" };
}

async function searchByName(){
  const name = document.getElementById('searchName').value.trim(); if(!name) return;
  if (currentCoins < 10) { showNoCoins(); return; }

  const box = document.getElementById('nameResultBox'); box.innerHTML = '<div class="card glass">Ищу ники...</div>';
  try{
    const r = await api('/search-by-name/'+encodeURIComponent(name));
    currentCoins = r.coinsLeft; updateCoinsUI();

    if(r.results.length === 0) { box.innerHTML = '<div class="card glass">Не найдено 😔</div>'; return; }

    box.innerHTML = r.results.map(item => {
      const rarity = getRarity(item.score);
      return `<div class="card glass ${rarity.class}" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">
        <div><div style="font-weight:900;font-size:18px">@${item.username}</div><div style="font-size:10px; color:${rarity.color}; font-weight:800; margin-top:4px;">${rarity.name}</div></div>
        <div style="background:rgba(255,255,255,0.05); color:${rarity.color}; padding:6px 12px; border-radius:12px;font-weight:900">${item.score}</div>
      </div>`;
    }).join('');
  }catch(e){ 
    if (e.message.includes('ЮК')) { showNoCoins(); return; }
    box.innerHTML = `<div class="card glass" style="color:var(--bad)">⚠ ${e.message}</div>`; 
  }
}

function showNoCoins() { document.getElementById('noCoinsModal').style.display = 'flex'; }
function closeNoCoins() { document.getElementById('noCoinsModal').style.display = 'none'; }
function buyCoins(){ window.location.href = 'https://t.me/skupgoldi25gfor1starbot?start=shop'; }
function inviteFriend(){ window.location.href = 'https://t.me/skupgoldi25gfor1starbot?start=invite'; }

async function loadFinds(){
  const list = document.getElementById('findsList');
  try{
    const rows = await api('/pool/top-finds');
    if(!rows.length){ list.innerHTML = '<div class="card glass">Пока пусто 🍩</div>'; return; }
    list.innerHTML = rows.map(r => {
      const rarity = getRarity(r.score);
      return `<div class="card glass ${rarity.class}" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:900; font-size: 18px;">@${r.username}</div>
          <div style="font-size:10px; color:${rarity.color}; font-weight:800; margin-top:4px;">${rarity.name}</div>
        </div>
        <div style="font-size:22px;font-weight:900;color:${rarity.color};">${r.score}</div>
      </div>`;
    }).join('');
  }catch(e){ list.innerHTML = `<div class="card glass">${e.message}</div>`; }
}

async function loadProfile(){
  document.getElementById('profileLogin').textContent = localStorage.getItem('bubfind_login') || 'User';
  document.getElementById('profileTier').textContent = localStorage.getItem('bubfind_tier') === 'premium' ? 'Тариф: Premium' : 'Тариф: Free';
  document.getElementById('profileUsername').textContent = localStorage.getItem('bubfind_profile_username') || '—';
}

async function loadTops() {
  try {
    const users = await api('/top/users');
    document.getElementById('topUsersList').innerHTML = users.map((u, i) => `
      <div class="top-user">
        <div class="place">${i + 1}</div>
        <div class="name">@${u.telegram_id}</div>
        <div class="value">${u.coins} ЮК</div>
      </div>
    `).join('');
  } catch(e) { document.getElementById('topUsersList').textContent = 'Ошибка загрузки'; }

  try {
    const hunters = await api('/top/hunters');
    document.getElementById('topHuntersList').innerHTML = hunters.map((u, i) => `
      <div class="top-user">
        <div class="place">${i + 1}</div>
        <div class="name">@${u.claimed_by}</div>
        <div class="value">${u.count} шт.</div>
      </div>
    `).join('');
  } catch(e) { document.getElementById('topHuntersList').textContent = 'Ошибка загрузки'; }
}

if(token) { go('main'); }
</script>
</body>
  </html>
