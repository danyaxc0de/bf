<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BubFind</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{ 
    --bg:#000000; 
    --card: rgba(255, 255, 255, 0.06); 
    --border: rgba(255, 255, 255, 0.1); 
    --text:#ffffff; 
    --sub:#8e8e93; 
    --accent:#0a84ff; 
    --accent2:#005bb5; 
    --ok:#32d74b; 
    --bad:#ff453a; 
    --star:#ffd60a; 
  }
  
  /* ТЕМЫ */
  body.theme-light {
    --bg:#f2f2f7; 
    --card: rgba(0, 0, 0, 0.05); 
    --border: rgba(0, 0, 0, 0.1); 
    --text:#000000; 
    --sub:#6e6e73; 
  }
  body.theme-gray {
    --bg:#1c1c1e; 
    --card: rgba(255, 255, 255, 0.1); 
    --border: rgba(255, 255, 255, 0.15); 
    --text:#ffffff; 
    --sub:#8e8e93; 
  }

  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;transition: background 0.3s;}
  body{ background: radial-gradient(circle at 50% 0%, rgba(10, 132, 255, 0.1), transparent 60%), var(--bg); }
  
  #app{position:relative;z-index:1;max-width:460px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
  .screen{display:none;flex-direction:column;flex:1;min-height:0;animation:slideIn .3s ease-out}
  .screen.active{display:flex}
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .topbar{padding:env(safe-area-inset-top,0px) 20px 0;display:flex;align-items:center;justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 20px); z-index: 10;}
  .brand{font-weight:900;font-size:24px;letter-spacing:-0.04em;display:flex;align-items:center;gap:8px; color: var(--text);}
  
  .glass { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; transition: 0.3s; }
  
  .badge{ font-size:12px;font-weight:700;color:var(--text); background: var(--card); border: 1px solid var(--border); padding:6px 12px;border-radius:999px; display:flex; align-items: center; gap:6px; }
  .badge.coins { color: var(--accent); border-color: var(--accent); }

  .tabs { display: flex; background: var(--card); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .tabs button { flex: 1; background: none; border: none; color: var(--sub); padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px;}
  .tabs button.active { background: var(--bg); color: var(--text); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

  .field { display:flex;align-items:center;padding:4px 4px 4px 16px; margin-bottom: 16px; }
  .field input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;padding:12px 8px}
  .field input::placeholder { color: var(--sub); }
  
  .btn{ background: var(--accent); border: none; color:#fff;font-weight:600;font-size:13px;border-radius:12px;padding:10px 16px;cursor:pointer; transition: 0.2s; }
  .btn:active { transform: scale(0.96); opacity: 0.8; }
  .btn-block{width:100%;padding:14px;border-radius:14px;font-size:15px}
  
  .tabbar{ position: fixed; bottom: calc(env(safe-area-inset-bottom, 10px) + 10px); left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; display:flex;justify-content:space-around;align-items:center; padding: 8px 10px; background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; z-index: 100; }
  .tabbar button{ background:none;border:none;color:var(--sub); display:flex;flex-direction:column;align-items:center;justify-content:center; width: 50px; height: 45px; border-radius: 16px; cursor:pointer; transition: 0.2s; }
  .tabbar button.active{ color: var(--accent); background: rgba(10, 132, 255, 0.1); }
  .tabbar button svg { width: 22px; height: 22px; fill: currentColor; }
  
  .content{flex:1;overflow:auto;padding:16px 20px 100px; z-index: 5;}
  .card{ padding:16px; margin-bottom:10px; animation: slideIn 0.2s ease-out; }
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--text);border:1px solid var(--border);padding:12px 20px;border-radius:12px;font-size:13px;font-weight: 500;opacity:0;transition:all .2s;z-index:200;max-width:90%;text-align:center;}
  .toast.show{opacity:1; transform: translateX(-50%) translateY(-5px);}

  .rarity-base { border: 1px solid var(--border); }
  .rarity-rare { border: 1px solid #0a84ff; box-shadow: 0 0 10px rgba(10, 132, 255, 0.2); }
  .rarity-epic { border: 1px solid #5e5ce6; box-shadow: 0 0 15px rgba(94, 92, 230, 0.3); }
  .rarity-legendary { border: 1px solid var(--star); box-shadow: 0 0 20px rgba(255, 214, 10, 0.4); animation: legendaryPulse 1.5s infinite alternate; }
  @keyframes legendaryPulse { from { box-shadow: 0 0 15px rgba(255, 214, 10, 0.3); } to { box-shadow: 0 0 30px rgba(255, 214, 10, 0.6); } }

  .theme-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .theme-modal .card { width: 100%; max-width: 340px; }
  .theme-option { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; border: 1px solid var(--border); }
  .theme-option.active { border-color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <section class="screen active" id="screen-login">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px">
      <div style="width:80px;height:80px;border-radius:24px;background:var(--accent); box-shadow: 0 10px 30px rgba(10, 132, 255, 0.3);"></div>
      <div style="margin-top:20px;font-size:28px;font-weight:900;">BubFind</div>
      <div style="margin-top:6px;font-size:13px;color:var(--sub);">Находи свободные юзернеймы</div>
    </div>
    <div style="padding:0 24px 24px;display:flex;flex-direction:column;gap:10px">
      <input id="loginInput" class="field glass" style="padding:14px;" placeholder="Логин">
      <input id="passInput" type="password" class="field glass" style="padding:14px;" placeholder="Пароль">
      <button class="btn btn-block" onclick="doLogin()">Войти</button>
      <button class="btn btn-block" style="background:transparent;border:1px solid var(--border);color:var(--text);" onclick="doRegister()">Создать аккаунт</button>
    </div>
  </section>

  <section class="screen" id="screen-main">
    <div class="topbar">
      <div class="brand">BubFind</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="badge coins" onclick="showNoCoins()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H8v-2h3V8h2v3h3v2h-3v4h-2z"/></svg>
          <span id="coinCount">30</span>
        </div>
        <div class="badge" id="userTierBadge">FREE</div>
      </div>
    </div>
    <div class="content">
      <div class="tabs">
        <button id="tabRandom" class="active" onclick="switchMode('random')">Рандом</button>
        <button id="tabName" onclick="switchMode('name')">Именной</button>
      </div>

      <div id="modeRandom">
        <button class="btn btn-block" style="background: var(--accent2); padding: 18px; font-size: 16px;" onclick="generateRandom()">Сгенерировать ник</button>
        <div style="font-size:12px; color:var(--sub); text-align:center; margin-bottom:20px; margin-top:8px;">Стоимость: 10 ЮК за 1 ник</div>
      </div>

      <div id="modeName" style="display:none;">
        <div class="field glass">
          <input id="searchName" placeholder="Введи имя (danya)">
          <button class="btn" onclick="searchByName()">Найти</button>
        </div>
        <div style="font-size:11px; color:var(--sub); text-align:center; margin-bottom:16px;">Стоимость: 20 ЮК</div>
      </div>

      <div id="nameResultBox"></div>
    </div>
    <div class="tabbar">
      <button class="active" onclick="go('main')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <button onclick="go('finds')"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button onclick="go('tops')"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 6h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg></button>
      <button onclick="go('profile')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
    </div>
  </section>

  <section class="screen" id="screen-finds">
    <div class="topbar"><div class="brand">Находки</div></div>
    <div class="content" id="findsList">Загрузка…</div>
    <div class="tabbar">
      <button onclick="go('main')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <button class="active" onclick="go('finds')"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button onclick="go('tops')"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 6h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg></button>
      <button onclick="go('profile')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
    </div>
  </section>

  <section class="screen" id="screen-tops">
    <div class="topbar"><div class="brand">Топы</div></div>
    <div class="content">
      <div class="card glass" style="margin-bottom:16px">
        <div style="font-weight:800; margin-bottom:10px; font-size:14px;">💎 Топ по ЮКам</div>
        <div id="topUsersList">Загрузка...</div>
      </div>
      <div class="card glass">
        <div style="font-weight:800; margin-bottom:10px; font-size:14px;">🎯 Топ ловцов</div>
        <div id="topHuntersList">Загрузка...</div>
      </div>
    </div>
    <div class="tabbar">
      <button onclick="go('main')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <button onclick="go('finds')"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button class="active" onclick="go('tops')"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 6h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg></button>
      <button onclick="go('profile')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
    </div>
  </section>

  <section class="screen" id="screen-profile">
    <div class="topbar"><div class="brand">Профиль</div></div>
    <div class="content">
      <div class="card glass" style="text-align:center; padding: 20px;">
        <div style="font-weight:900; font-size: 18px;" id="profileLogin">—</div>
        <div style="font-size:12px;color:var(--sub);margin-top:4px;" id="profileTier">Тариф: Free</div>
        <div style="margin-top: 15px;">
          <span style="font-size: 12px; color: var(--sub);">Выбранный ник:</span>
          <span style="font-weight: 900; color: var(--accent); font-size: 16px; margin-left: 5px;" id="profileUsername">—</span>
        </div>
      </div>

      <div class="card glass" style="margin-bottom:16px">
        <button class="btn btn-block" style="background: transparent; border: 1px solid var(--border); color: var(--text);" onclick="openThemeModal()">🎨 Сменить тему</button>
      </div>

      <div class="card glass" style="margin-bottom:16px">
        <div style="font-weight:800;margin-bottom:10px; font-size: 14px;">🍩 Рефералка</div>
        <div class="field" style="padding:10px;"><span id="refLink" style="font-size:12px;color:var(--text);word-break:break-all;">—</span></div>
        <button class="btn btn-block" style="background:transparent; border:1px solid var(--border);" onclick="copyRef()">Скопировать ссылку</button>
      </div>

      <div class="card glass">
        <div style="font-weight:800;margin-bottom:10px; font-size: 14px;">🎟 Промокод</div>
        <div class="field glass" style="padding:4px;">
          <input id="promoInput" placeholder="Введи код" style="padding:10px; font-size:14px;">
          <button class="btn" onclick="redeemPromo()">Активировать</button>
        </div>
      </div>

      <button onclick="logout()" style="background:none; border:none; color:var(--bad); font-size:13px; cursor:pointer; margin-top:20px; width:100%;">Выйти</button>
    </div>
    <div class="tabbar">
      <button onclick="go('main')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <button onclick="go('finds')"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button onclick="go('tops')"><svg viewBox="0 0 24 24"><path d="M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 6h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg></button>
      <button class="active" onclick="go('profile')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
    </div>
  </section>

  <div id="themeModal" class="theme-modal">
    <div class="card glass">
      <div style="font-weight:900; font-size: 18px; margin-bottom: 16px; text-align: center;">🎨 Выбор темы</div>
      
      <div class="theme-option" onclick="setTheme('dark')">
        <span>Темная</span>
        <span style="color: #000; background: #222; padding: 5px 10px; border-radius: 5px;">Aa</span>
      </div>
      
      <div class="theme-option" onclick="setTheme('light')">
        <span>Светлая</span>
        <span style="color: #000; background: #fff; padding: 5px 10px; border-radius: 5px;">Aa</span>
      </div>
      
      <div class="theme-option" onclick="setTheme('gray')">
        <span>Серая</span>
        <span style="color: #fff; background: #444; padding: 5px 10px; border-radius: 5px;">Aa</span>
      </div>

      <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px;">
        <div style="font-weight: 800; font-size: 14px; margin-bottom: 10px; color: var(--accent);">Premium Палитра</div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div onclick="setPalette('#ff453a')" style="width: 30px; height: 30px; border-radius: 50%; background: #ff453a; cursor: pointer;"></div>
          <div onclick="setPalette('#32d74b')" style="width: 30px; height: 30px; border-radius: 50%; background: #32d74b; cursor: pointer;"></div>
          <div onclick="setPalette('#ffd60a')" style="width: 30px; height: 30px; border-radius: 50%; background: #ffd60a; cursor: pointer;"></div>
          <div onclick="setPalette('#bf5af2')" style="width: 30px; height: 30px; border-radius: 50%; background: #bf5af2; cursor: pointer;"></div>
          <div onclick="setPalette('#0a84ff')" style="width: 30px; height: 30px; border-radius: 50%; background: #0a84ff; cursor: pointer;"></div>
        </div>
      </div>

      <button class="btn btn-block" style="margin-top: 20px; background: transparent; border: 1px solid var(--border); color: var(--text);" onclick="closeThemeModal()">Закрыть</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = '';
let token = localStorage.getItem('bubfind_token') || null;
let currentCoins = 30;
let currentMode = 'random';

const savedTheme = localStorage.getItem('bubfind_theme') || 'dark';
const savedPalette = localStorage.getItem('bubfind_palette');
if (savedTheme !== 'dark') document.body.classList.add('theme-' + savedTheme);
if (savedPalette) document.documentElement.style.setProperty('--accent', savedPalette);

function openThemeModal() { document.getElementById('themeModal').style.display = 'flex'; }
function closeThemeModal() { document.getElementById('themeModal').style.display = 'none'; }

function setTheme(theme) {
  document.body.classList.remove('theme-light', 'theme-gray');
  if (theme !== 'dark') document.body.classList.add('theme-' + theme);
  localStorage.setItem('bubfind_theme', theme);
  toast('Тема изменена');
  closeThemeModal();
}

function setPalette(color) {
  const tier = localStorage.getItem('bubfind_tier');
  if (tier !== 'premium') {
    toast('Палитра доступна только с Premium!');
    return;
  }
  document.documentElement.style.setProperty('--accent', color);
  localStorage.setItem('bubfind_palette', color);
  toast('Цвет изменен');
  closeThemeModal();
}

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }
async function api(path, opts={}){ const res = await fetch(API_BASE + path, { ...opts, headers: { 'Content-Type':'application/json', ...(token ? {Authorization:'Bearer '+token} : {}), ...(opts.headers||{}) } }); const data = await res.json().catch(()=>({})); if(!res.ok) throw new Error(data.error || 'Ошибка запроса'); return data; }
function updateCoinsUI() { document.getElementById('coinCount').textContent = currentCoins; }

function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='finds') loadFinds();
  if(name==='profile') loadProfile();
  if(name==='tops') loadTops();
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tabRandom').classList.toggle('active', mode === 'random');
  document.getElementById('tabName').classList.toggle('active', mode === 'name');
  document.getElementById('modeRandom').style.display = mode === 'random' ? 'block' : 'none';
  document.getElementById('modeName').style.display = mode === 'name' ? 'block' : 'none';
  document.getElementById('nameResultBox').innerHTML = '';
}

async function doLogin(){
  try{
    const data = await api('/auth/login', {method:'POST', body: JSON.stringify({ login: document.getElementById('loginInput').value, password: document.getElementById('passInput').value })});
    token = data.token; localStorage.setItem('bubfind_token', token); 
    localStorage.setItem('bubfind_login', document.getElementById('loginInput').value);
    localStorage.setItem('bubfind_tier', data.tier || 'free');
    currentCoins = data.coins || 30; updateCoinsUI();
    toast('Успешный вход'); go('main');
  }catch(e){ toast(e.message); }
}

async function doRegister(){
  try{
    const data = await api('/auth/register', {method:'POST', body: JSON.stringify({ login: document.getElementById('loginInput').value, password: document.getElementById('passInput').value })});
    token = data.token; localStorage.setItem('bubfind_token', token); 
    localStorage.setItem('bubfind_login', document.getElementById('loginInput').value);
    localStorage.setItem('bubfind_tier', 'free');
    currentCoins = 30; updateCoinsUI();
    toast('Аккаунт создан'); go('main');
  }catch(e){ toast(e.message); }
}

function logout(){ token = null; localStorage.clear(); go('login'); }

function getRarity(score) {
  if (score >= 80) return { name: "ЛЕГЕНДАРНЫЙ", class: "rarity-legendary", color: "#ffd60a" };
  if (score >= 60) return { name: "ЭПИЧЕСКИЙ", class: "rarity-epic", color: "#5e5ce6" };
  if (score >= 40) return { name: "РЕДКИЙ", class: "rarity-rare", color: "#0a84ff" };
  return { name: "БАЗОВЫЙ", class: "rarity-base", color: "#8e8e93" };
}

async function searchByName(){
  const name = document.getElementById('searchName').value.trim(); if(!name) return;
  if (currentCoins < 20) { showNoCoins(); return; }

  const box = document.getElementById('nameResultBox'); box.innerHTML = '<div class="card glass">Ищу ники...</div>';
  try{
    const r = await api('/search-by-name/'+encodeURIComponent(name));
    currentCoins = r.coinsLeft; updateCoinsUI();

    if(r.results.length === 0) { box.innerHTML = '<div class="card glass">Не найдено 😔</div>'; return; }

    box.innerHTML = r.results.map(item => {
      const rarity = getRarity(item.score);
      return `<div class="card glass ${rarity.class}" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <div><div style="font-weight:800;font-size:18px">@${item.username}</div><div style="font-size:10px; color:${rarity.color}; font-weight:800; margin-top:2px;">${rarity.name}</div></div>
        <div style="color:${rarity.color}; font-weight:900">${item.score}</div>
      </div>`;
    }).join('');
  }catch(e){ 
    if (e.message.includes('ЮК')) { showNoCoins(); return; }
    box.innerHTML = `<div class="card glass" style="color:var(--bad)">⚠ ${e.message}</div>`; 
  }
}

async function generateRandom(){
  if (currentCoins < 10) { showNoCoins(); return; }
  
  const box = document.getElementById('nameResultBox'); box.innerHTML = '<div class="card glass">Ищу ник...</div>';
  try {
    const r = await api('/generate-random');
    currentCoins = r.coinsLeft; updateCoinsUI();
    
    const item = r.result;
    const rarity = getRarity(item.score);
    
    if (item.status !== 'free') {
      box.innerHTML = `<div class="card glass rarity-base" style="text-align:center;"><div style="font-size:18px;color:var(--sub)">@${item.username}</div><div style="font-weight:800;color:var(--bad);margin-top:8px;">Увы, ник занят</div></div>`;
      return;
    }

    box.innerHTML = `
      <div class="card glass ${rarity.class}" style="text-align:center; padding: 30px 20px;">
        <div style="font-size:10px; color:${rarity.color}; font-weight:800; margin-bottom:5px;">${rarity.name}</div>
        <div style="font-weight:900;font-size:32px; margin-bottom:10px;">@${item.username}</div>
        <div style="font-weight:900;color:${rarity.color}; font-size:24px;">Score: ${item.score}</div>
      </div>`;
  } catch(e) { box.innerHTML = `<div class="card glass" style="color:var(--bad)">⚠ ${e.message}</div>`; }
}

function showNoCoins() { document.getElementById('noCoinsModal').style.display = 'flex'; }
function closeNoCoins() { document.getElementById('noCoinsModal').style.display = 'none'; }
function buyCoins(){ window.location.href = 'https://t.me/skupgoldi25gfor1starbot?start=shop'; }

async function loadFinds(){
  const list = document.getElementById('findsList');
  try{
    const rows = await api('/pool/top-finds');
    if(!rows.length){ list.innerHTML = '<div class="card glass">Пока пусто 🍩</div>'; return; }
    list.innerHTML = rows.map(r => {
      const rarity = getRarity(r.score);
      return `<div class="card glass ${rarity.class}" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:800; font-size: 16px;">@${r.username}</div><div style="font-size:10px; color:${rarity.color}; font-weight:800; margin-top:2px;">${rarity.name}</div></div>
        <div style="font-weight:900;color:${rarity.color};">${r.score}</div>
      </div>`;
    }).join('');
  }catch(e){ list.innerHTML = `<div class="card glass">${e.message}</div>`; }
}

async function loadProfile(){
  document.getElementById('profileLogin').textContent = localStorage.getItem('bubfind_login') || 'User';
  document.getElementById('profileTier').textContent = localStorage.getItem('bubfind_tier') === 'premium' ? 'Тариф: Premium' : 'Тариф: Free';
  document.getElementById('profileUsername').textContent = localStorage.getItem('bubfind_profile_username') || '—';

  try {
    const ref = await api('/referral/me');
    document.getElementById('refLink').textContent = ref.link;
  } catch(e) {}
}

async function redeemPromo() {
  const code = document.getElementById('promoInput').value.trim();
  if(!code) return;
  try {
    await api('/promo/redeem', { method: 'POST', body: JSON.stringify({ code }) });
    toast('Промокод активирован!');
    document.getElementById('promoInput').value = '';
  } catch(e) { toast(e.message); }
}

function copyRef() {
  const text = document.getElementById('refLink').textContent;
  navigator.clipboard?.writeText(text);
  toast('Ссылка скопирована');
}

async function loadTops() {
  try {
    const users = await api('/top/users');
    document.getElementById('topUsersList').innerHTML = users.map((u, i) => `
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="font-weight:600">${i+1}. @${u.telegram_id}</div>
        <div style="color:var(--accent);font-weight:700">${u.coins} ЮК</div>
      </div>
    `).join('');
  } catch(e) { document.getElementById('topUsersList').textContent = 'Ошибка'; }

  try {
    const hunters = await api('/top/hunters');
    document.getElementById('topHuntersList').innerHTML = hunters.map((u, i) => `
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="font-weight:600">${i+1}. @${u.claimed_by}</div>
        <div style="color:var(--accent);font-weight:700">${u.count} шт.</div>
      </div>
    `).join('');
  } catch(e) { document.getElementById('topHuntersList').textContent = 'Ошибка'; }
}
