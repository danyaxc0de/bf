<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BubFind</title>
<meta name="description" content="Находи свободные Telegram-юзернеймы">
<meta name="theme-color" content="#0a0a0e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#0a0a0e; --bg2:#101016; --card:#15151d; --border:#262633;
    --text:#f2f2f5; --sub:#8b8b96; --accent:#6fa8ff; --accent2:#2b4fb8;
    --ok:#4ade80; --bad:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
  html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
  body{
    -webkit-tap-highlight-color:transparent;
    background:
      radial-gradient(circle at 15% 10%, rgba(111,168,255,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(43,79,184,0.10), transparent 45%),
      var(--bg);
  }
  .donut{position:fixed;border-radius:50%;pointer-events:none;z-index:0;opacity:0.5}
  .donut::after{content:'';position:absolute;inset:28%;border-radius:50%;background:var(--bg)}
  #app{position:relative;z-index:1;max-width:460px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
  .screen{display:none;flex-direction:column;flex:1;min-height:0;animation:fade .25s ease}
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .topbar{padding:env(safe-area-inset-top,0px) 20px 0;display:flex;align-items:center;justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
  .brand{font-weight:800;font-size:20px;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px}
  .brand .ring{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--accent),var(--accent2),var(--accent));position:relative}
  .brand .ring::after{content:'';position:absolute;inset:30%;border-radius:50%;background:var(--bg2)}
  .badge{font-size:11px;font-weight:700;color:#0a0a0e;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:5px 10px;border-radius:999px}

  .field{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px 4px 4px 16px}
  .field input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:16px;padding:12px 8px}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#0a0a0e;font-weight:700;font-size:14px;border-radius:10px;padding:12px 18px;cursor:pointer}
  .btn-block{width:100%;padding:14px;border-radius:12px;font-size:15px}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
  .pill.ok{background:rgba(74,222,128,0.12);color:var(--ok)}
  .pill.bad{background:rgba(248,113,113,0.12);color:var(--bad)}
  .pill.lock{background:rgba(111,168,255,0.1);color:var(--accent)}

  .row{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid #1c1c26;background:none;border-left:none;border-right:none;border-top:none;color:var(--text);width:100%;text-align:left;cursor:pointer}
  .row:last-child{border-bottom:none}
  .row span.label{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500}

  .tabbar{display:flex;justify-content:space-around;align-items:center;padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid #1c1c26;background:var(--bg2)}
  .tabbar button{background:none;border:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer}
  .tabbar button.active{color:var(--accent)}

  .content{flex:1;overflow:auto;padding:16px 20px 20px}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1c1c26;border:1px solid var(--border);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;z-index:50;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  label.small{font-size:12px;color:var(--sub);display:block;margin-bottom:8px}
</style>
</head>
<body>

<div class="donut" style="width:140px;height:140px;top:-30px;left:-40px;background:#2a2a35"></div>
<div class="donut" style="width:90px;height:90px;top:120px;right:-30px;background:#1c3a66"></div>
<div class="donut" style="width:60px;height:60px;bottom:160px;left:-20px;background:#3a3a46"></div>
<div class="donut" style="width:110px;height:110px;bottom:-40px;right:-50px;background:#16284d"></div>

<audio id="bgMusic" src="https://cdn.budgetpixel.com/audio-library/music/ambient-peaceful-slow-soft-piano-cw0x9s.wav" loop preload="none"></audio>

<div id="app">

  <section class="screen active" id="screen-login">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px">
      <div style="width:72px;height:72px;border-radius:24px;background:conic-gradient(var(--accent),var(--accent2),var(--accent));position:relative">
        <div style="position:absolute;inset:26%;border-radius:50%;background:var(--bg)"></div>
      </div>
      <div style="margin-top:18px;font-size:24px;font-weight:800">BubFind</div>
      <div style="margin-top:6px;font-size:13px;color:var(--sub)">Находи свободные юзернеймы</div>
    </div>
    <div style="padding:0 24px 24px;display:flex;flex-direction:column;gap:10px">
      <label class="small" for="loginInput">Логин</label>
      <input id="loginInput" class="field" style="padding:14px 16px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:15px">
      <label class="small" for="passInput" style="margin-top:4px">Пароль</label>
      <input id="passInput" type="password" class="field" style="padding:14px 16px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:15px">
      <button class="btn btn-block" style="margin-top:10px" onclick="doLogin()">Войти</button>
      <button class="btn btn-ghost btn-block" onclick="doRegister()">Создать аккаунт</button>
      <div style="text-align:center;font-size:11px;color:#5b5b66;margin-top:4px">Защищено от ботов и абуза</div>
    </div>
  </section>

  <section class="screen" id="screen-main">
    <div class="topbar">
      <div class="brand"><span class="ring"></span>BubFind</div>
      <div class="badge" id="tierBadge">FREE</div>
    </div>
    <div class="content">
      <label class="small" for="search">Проверь юзернейм</label>
      <div class="field" style="margin-bottom:16px">
        <span style="color:var(--sub);font-size:16px">@</span>
        <input id="search" placeholder="danya">
        <button class="btn" onclick="checkUsername()">Найти</button>
      </div>
      <div id="resultBox"></div>
    </div>
    <div class="tabbar">
      <button class="active" onclick="go('main')">🔍 Поиск</button>
      <button onclick="go('finds')">🍩 Находки</button>
      <button onclick="go('profile')">👤 Профиль</button>
    </div>
  </section>

  <section class="screen" id="screen-finds">
    <div class="topbar"><div class="brand"><span class="ring"></span>Топ находки</div></div>
    <div class="content" id="findsList">Загрузка…</div>
    <div class="tabbar">
      <button onclick="go('main')">🔍 Поиск</button>
      <button class="active" onclick="go('finds')">🍩 Находки</button>
      <button onclick="go('profile')">👤 Профиль</button>
    </div>
  </section>

  <section class="screen" id="screen-profile">
    <div class="topbar"><div class="brand"><span class="ring"></span>Профиль</div></div>
    <div class="content">
      <div class="card" style="margin-bottom:16px">
        <div style="font-weight:700" id="profileLogin">—</div>
        <div style="font-size:12px;color:var(--sub);margin-top:2px" id="profileTier">Тариф: Free</div>
        <button class="btn btn-block" style="margin-top:14px" onclick="buyPremium()">Купить Premium ⭐</button>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div style="font-weight:700;margin-bottom:10px">🍩 Пригласи друга</div>
        <div style="font-size:12px;color:var(--sub);margin-bottom:10px">+3 дня Premium тебе и другу за каждого приглашённого</div>
        <div class="field" style="padding:10px 14px"><span id="refLink" style="font-size:13px;color:var(--text);word-break:break-all">—</span></div>
        <button class="btn-ghost btn btn-block" style="margin-top:10px" onclick="copyRef()">Скопировать ссылку</button>
        <div style="font-size:12px;color:var(--sub);margin-top:8px" id="refStats"></div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div style="font-weight:700;margin-bottom:10px">Промокод</div>
        <div style="font-size:12px;color:var(--sub);margin-bottom:10px">Коды публикуются в канале @bubmagnat</div>
        <div class="field" style="padding:4px"><input id="promoInput" placeholder="BUBFIND7" style="flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;padding:12px"><button class="btn" onclick="redeemPromo()">OK</button></div>
      </div>

      <div class="card">
        <button class="row" onclick="toggleMusic()">
          <span class="label">🎵 Фоновая музыка</span><span id="musicState">выкл</span>
        </button>
        <button class="row" onclick="logout()"><span class="label">Выйти</span><span>›</span></button>
      </div>
    </div>
    <div class="tabbar">
      <button onclick="go('main')">🔍 Поиск</button>
      <button onclick="go('finds')">🍩 Находки</button>
      <button class="active" onclick="go('profile')">👤 Профиль</button>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = localStorage.getItem('bubfind_api') || '';
let token = localStorage.getItem('bubfind_token') || null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='finds') loadFinds();
  if(name==='profile') loadProfile();
}

async function api(path, opts={}){
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      'Content-Type':'application/json',
      ...(token ? {Authorization:'Bearer '+token} : {}),
      ...(opts.headers||{})
    }
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Ошибка запроса');
  return data;
}

function getRefFromUrl(){
  const p = new URLSearchParams(location.search);
  return p.get('ref');
}

async function doLogin(){
  try{
    const data = await api('/auth/login', {method:'POST', body: JSON.stringify({
      login: document.getElementById('loginInput').value,
      password: document.getElementById('passInput').value
    })});
    token = data.token; localStorage.setItem('bubfind_token', token);
    go('main'); enableMusicOnce();
  }catch(e){ toast(e.message); }
}

async function doRegister(){
  try{
    const data = await api('/auth/register', {method:'POST', body: JSON.stringify({
      login: document.getElementById('loginInput').value,
      password: document.getElementById('passInput').value,
      ref: getRefFromUrl()
    })});
    token = data.token; localStorage.setItem('bubfind_token', token);
    toast('Аккаунт создан 🍩');
    go('main'); enableMusicOnce();
  }catch(e){ toast(e.message); }
}

function logout(){
  token = null; localStorage.removeItem('bubfind_token');
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-login').classList.add('active');
}

async function checkUsername(){
  const u = document.getElementById('search').value.replace('@','').trim();
  if(!u) return;
  const box = document.getElementById('resultBox');
  box.innerHTML = '<div class="card">Проверяю…</div>';
  try{
    const r = await api('/check/'+encodeURIComponent(u));
    renderResult(r);
  }catch(e){ box.innerHTML = `<div class="card"><div class="pill bad">⚠ ${e.message}</div></div>`; }
}

function renderResult(r){
  const box = document.getElementById('resultBox');
  if(r.status === 'taken'){
    box.innerHTML = `<div class="card"><div style="font-size:20px;font-weight:700">@${r.username}</div><div class="pill bad" style="margin-top:8px">● Занят</div></div>`;
    return;
  }
  if(r.status === 'invalid_format'){
    box.innerHTML = `<div class="card"><div class="pill bad">Некорректный формат</div></div>`;
    return;
  }
  const statusPill = r.status==='free'
    ? '<span class="pill ok">● Свободен</span>'
    : r.status==='fragment_sale'
      ? `<span class="pill lock">💎 Fragment · ${r.price||'?'} TON</span>`
      : '<span class="pill lock">🔒 Fragment, не продаётся</span>';

  const breakdown = r.score_breakdown ? Object.entries(r.score_breakdown).map(([k,v])=>
    `<div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--sub)">${k}</span><span style="font-weight:600">${v>0?'+':''}${v}</span></div>`
  ).join('') : '';

  box.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div style="font-size:22px;font-weight:700">@${r.username}</div><div style="margin-top:6px">${statusPill}</div></div>
        <div style="text-align:right"><div style="font-size:11px;color:var(--sub)">Score</div><div style="font-size:28px;font-weight:800;color:var(--accent)">${r.score??'—'}</div></div>
      </div>
      <div style="margin-top:16px;height:1px;background:var(--border)"></div>
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">${breakdown}</div>
      <button class="btn btn-block" style="margin-top:16px;background:#f2f2f5;color:#0a0a0e" onclick="claimUsername('${r.username}')">Занять юзернейм</button>
    </div>`;
}

async function claimUsername(username){
  try{
    await api('/pool/claim/'+encodeURIComponent(username), {method:'POST'});
    toast('Юзернейм забронирован 🍩');
  }catch(e){ toast(e.message); }
}

async function loadFinds(){
  const list = document.getElementById('findsList');
  try{
    const rows = await api('/pool/top-finds');
    if(!rows.length){ list.innerHTML = '<div class="card">Пока пусто — сканер ищет 🍩</div>'; return; }
    list.innerHTML = rows.map(r=>`
      <div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:700">@${r.username}</div>
          <div style="font-size:11px;margin-top:4px;color:${r.status==='free'?'var(--ok)':'var(--accent)'}">
            ${r.status==='free' ? '● Свободен' : '💎 '+(r.fragment_price?r.fragment_price+' TON':'Fragment')}
          </div>
        </div>
        <div style="text-align:right"><div style="font-size:18px;font-weight:800;color:var(--accent)">${r.score}</div></div>
      </div>`).join('');
  }catch(e){ list.innerHTML = `<div class="card">${e.message}</div>`; }
}

async function loadProfile(){
  try{
    const ref = await api('/referral/me');
    document.getElementById('refLink').textContent = ref.link;
    document.getElementById('refStats').textContent = `Приглашено: ${ref.invited} · ${ref.bonusPerInvite}`;
  }catch(e){}
}

function copyRef(){
  const text = document.getElementById('refLink').textContent;
  navigator.clipboard?.writeText(text);
  toast('Ссылка скопирована');
}

async function redeemPromo(){
  const code = document.getElementById('promoInput').value.trim();
  if(!code) return;
  try{
    const r = await api('/promo/redeem', {method:'POST', body: JSON.stringify({code})});
    toast('Начислено: '+r.granted+' 🍩');
  }catch(e){ toast(e.message); }
}

async function buyPremium(){
  try{
    const r = await api('/premium/purchase-link');
    location.href = r.url;
  }catch(e){ toast(e.message); }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

let musicOn = false;
function enableMusicOnce(){
  const audio = document.getElementById('bgMusic');
  audio.volume = 0.12;
}
function toggleMusic(){
  const audio = document.getElementById('bgMusic');
  musicOn = !musicOn;
  if(musicOn){ audio.play().catch(()=>{}); } else { audio.pause(); }
  document.getElementById('musicState').textContent = musicOn ? 'вкл' : 'выкл';
}
</script>
</body>
</html>
